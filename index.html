<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Labyrinth</title>
    <meta name="description" content="">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <script>
      // Parche temprano: evita InUseAttributeError cuando Unity llama
      // requestPointerLock() mientras el puntero ya esta bloqueado.
      (function () {
        var _orig = HTMLElement.prototype.requestPointerLock;
        HTMLElement.prototype.requestPointerLock = function () {
          try {
            var r = _orig.call(this);
            if (r && typeof r.catch === 'function')
              r.catch(function (e) { /* suprimido */ });
            return r;
          } catch (e) { /* suprimido */ }
        };
      })();
    </script>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container" style="width:100%;height:100%;">
        <canvas id="unity-canvas" style="width:100%;height:100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>AR</button>
      </div>
    </div>

    <script>
      var buildUrl   = "Build";
      var loaderUrl  = buildUrl + "/Videojuego Laberinto.loader.js";
      var config = {
        dataUrl:              buildUrl + "/Videojuego Laberinto.data",
        frameworkUrl:         buildUrl + "/Videojuego Laberinto.framework.js",
        codeUrl:              buildUrl + "/Videojuego Laberinto.wasm",
        streamingAssetsUrl:   "StreamingAssets",
        companyName:          "DefaultCompany",
        productName:          "Labyrinth",
        productVersion:       "1.0",
      };

      var canvas       = document.querySelector("#unity-canvas");
      var loadingBar   = document.querySelector("#unity-loading-bar");
      var progressFull = document.querySelector("#unity-progress-bar-full");
      var unityInstance = null;
      

      loadingBar.style.display = "block";

      var script  = document.createElement("script");
      script.src  = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressFull.style.width = (100 * progress) + "%";
        }).then(function (instance) {
          unityInstance = instance;
          loadingBar.style.display = "none";
        }).catch(function (message) {
          // Solo mostrar errores que no sean de pointer lock
          if (message && message.toString().toLowerCase().indexOf('pointer') === -1)
            console.error('[Unity]', message);
        });
      };
      document.body.appendChild(script);

      var enterARButton = document.getElementById('enterar');
      var enterVRButton = document.getElementById('entervr');

      document.addEventListener('onARSupportedCheck', function (e) {
        enterARButton.disabled = !e.detail.supported;
      });
      document.addEventListener('onVRSupportedCheck', function (e) {
        enterVRButton.disabled = !e.detail.supported;
      });

      enterARButton.addEventListener('click', function () {
        if (unityInstance) unityInstance.Module.WebXR.toggleAR();
      });
      enterVRButton.addEventListener('click', function () {
        if (unityInstance) unityInstance.Module.WebXR.toggleVR();
      });
    </script>
  </body>
</html>
